description: Open-agents handoff fixture smoke eval

prompts:
  - file://prompts/a-main-agent-spec.md
  - file://prompts/b-title-tail-history.md
  - file://prompts/c-spec-writer-title-tail-history.md

providers:
  - 'exec: node ./scripts/promptfoo-provider.mjs'

tests:
  # 1. Smoke test: fixture preparation only.
  - vars:
      fixture: nextbase-supabase-starter
      scenario: fixture-prepare-smoke
      tailChars: 50000
      goal: Prepare the pinned fixture repo and report whether the checkout is available for open-agents handoff testing.
      context: This prompt stands in for the current baseline where the main agent writes a detailed execution spec before delegating.
      historyPointer: not wired in this smoke slice.
    assert:
      - type: contains
        value: '"ok":true'
      - type: contains
        value: '"fixture":"nextbase-supabase-starter"'

  # 2. Real explore test: runs the explore agent and performs LLM-as-judge grading.
  - vars:
      fixture: nextbase-supabase-starter
      scenario: explore-private-items
      tailChars: 50000
      goal: In the pinned Supabase starter fixture, trace how the private-items CRUD flow is structured from route/page entry points through server/data access and Supabase calls. Cite relevant files and lines. Do not modify files.
      context: Trace route/page entry points, server/data access, and Supabase client calls for private-items CRUD.
      historyPointer: not wired.
    assert:
      - type: contains
        value: 'private'
      - type: contains
        value: 'Supabase'
      - type: javascript
        value: |
          // Verify that output contains a path:line citation
          return /[\w.-]+\.\w+:(?:L)?\d+/.test(output);

      - type: llm-rubric
        metric: coverage
        threshold: 0.7
        provider: file://scripts/promptfoo-grader-provider.mjs
        value: |
          Score coverage from 0.0 to 1.0:
          1.0 = identifies all important implementation areas needed for the task.
          0.7 = covers the main implementation path but misses minor useful details.
          0.4 = partial answer; misses important modules or relationships.
          0.0 = mostly unrelated or not enough detail to act.

          Note: The candidate output was generated against the checked-out fixture repository (not this runner workspace). Do not attempt to locate the files in the current workspace directory.

      - type: llm-rubric
        metric: usefulness
        threshold: 0.7
        provider: file://scripts/promptfoo-grader-provider.mjs
        value: |
          Score usefulness from 0.0 to 1.0:
          1.0 = a developer could confidently use this to make the next decision.
          0.7 = useful with small follow-up inspection.
          0.4 = somewhat useful but requires substantial rework.
          0.0 = not useful.

          Note: The candidate output was generated against the checked-out fixture repository (not this runner workspace). Do not attempt to locate the files in the current workspace directory.

      - type: llm-rubric
        metric: hallucination_safety
        threshold: 0.8
        provider: file://scripts/promptfoo-grader-provider.mjs
        value: |
          Score hallucination safety from 0.0 to 1.0:
          1.0 = claims are grounded in cited files or clearly marked as inference.
          0.7 = mostly grounded, with minor uncited claims.
          0.4 = several unsupported claims.
          0.0 = fabricates files, APIs, behavior, or line numbers.

          Note: The candidate output was generated against the checked-out fixture repository (not this runner workspace). Do not attempt to locate the files in the current workspace directory. Assume the files cited exist in the fixture repo.

      - type: llm-rubric
        metric: citation_quality
        threshold: 0.7
        provider: file://scripts/promptfoo-grader-provider.mjs
        value: |
          Score citation quality from 0.0 to 1.0:
          1.0 = all references point directly to exact files and valid line numbers that exist and are relevant.
          0.7 = references are mostly relevant and correct but might miss minor details or include slight misalignment.
          0.4 = many references are vague, point to incorrect files/lines, or are missing for key statements.
          0.0 = no citations or completely incorrect/fabricated citations.

          Note: The candidate output was generated against the checked-out fixture repository (not this runner workspace). Do not attempt to locate the files in the current workspace directory. Assume the files cited exist in the fixture repo.

      - type: llm-rubric
        metric: actionability
        threshold: 0.7
        provider: file://scripts/promptfoo-grader-provider.mjs
        value: |
          Score actionability from 0.0 to 1.0:
          1.0 = provides clear, concrete next steps, command suggestions, or precise file edits so a developer or agent can act immediately.
          0.7 = suggests concrete next steps but requires some interpretation or minor planning.
          0.4 = broad suggestions without clear instructions or code locations.
          0.0 = vague, generic advice that cannot be directly acted upon.

          Note: The candidate output was generated against the checked-out fixture repository (not this runner workspace). Do not attempt to locate the files in the current workspace directory.
